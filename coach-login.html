<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Admin Login - SKM.WELLNESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            skm: {
              blue: '#0284c7',
              darkblue: '#0369a1',
              accent: '#0ea5e9',
              light: '#f0f9ff'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-50 to-blue-100 dark:from-slate-900 dark:to-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Login Card -->
    <div id="login-screen" class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 space-y-6">
      <div class="text-center">
        <div class="w-20 h-20 bg-gradient-to-br from-sky-500 to-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
          <i class="ph ph-user-circle-gear text-white text-4xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Coach Admin</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">SKM.WELLNESS Management</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="text-sm font-medium text-slate-600 dark:text-slate-300 block mb-2">Username</label>
          <div class="relative">
            <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input
              type="text"
              id="username"
              placeholder="admin"
              class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 outline-none transition"
              required
            >
          </div>
        </div>

        <div>
          <label class="text-sm font-medium text-slate-600 dark:text-slate-300 block mb-2">Password</label>
          <div class="relative">
            <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 outline-none transition"
              required
            >
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold rounded-xl shadow-lg shadow-sky-500/30 transition-all active:scale-95">
          เข้าสู่ระบบ
        </button>
      </form>

      <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
        <a href="index.html" class="text-sm text-sky-600 hover:text-sky-700 flex items-center justify-center gap-2">
          <i class="ph ph-arrow-left"></i> กลับหน้าหลัก
        </a>
      </div>

      <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl p-3 text-xs text-amber-800 dark:text-amber-200">
        <i class="ph ph-warning text-base"></i> <strong>Default:</strong> admin / admin123
      </div>
    </div>
  </div>

  <script>
    // Default credentials (ในการใช้งานจริงควรใช้ระบบ Authentication ที่ปลอดภัยกว่า)
    const ADMIN_CREDENTIALS = {
      username: 'admin',
      password: 'admin123' // เปลี่ยนได้ตามต้องการ
    };

    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
        // บันทึก session
        sessionStorage.setItem('coach_admin_auth', 'true');
        sessionStorage.setItem('coach_admin_login_time', new Date().toISOString());

        // Redirect to dashboard
        window.location.href = 'coach-dashboard.html';
      } else {
        showError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      }
    }

    function showError(message) {
      const existingError = document.querySelector('.error-message');
      if (existingError) existingError.remove();

      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-600 dark:text-rose-300 px-4 py-3 rounded-xl text-sm flex items-center gap-2';
      errorDiv.innerHTML = `<i class="ph ph-warning-circle text-lg"></i> ${message}`;

      const form = document.querySelector('form');
      form.parentElement.insertBefore(errorDiv, form);

      setTimeout(() => errorDiv.remove(), 3000);
    }

    // Check if already logged in
    if (sessionStorage.getItem('coach_admin_auth') === 'true') {
      window.location.href = 'coach-dashboard.html';
    }

    // Load theme
    if (localStorage.getItem('app_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

</body>
</html>
